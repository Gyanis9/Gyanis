logs:
  - name: root
    level: info
    appenders:
      - type: FileLogAppender
        file: logs/project_name/root.log
      - type: StdoutLogAppender
  - name: system
    level: info
    appenders:
      - type: FileLogAppender
        file: logs/project_name/system.log
      - type: StdoutLogAppender