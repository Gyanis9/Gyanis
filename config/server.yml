# config/server.yml
server:
  host: "0.0.0.0"
  port: 8080
  max_connections: 1000
  timeout_ms: 30000

# config/database.yml
database:
  driver: "postgresql"
  host: "localhost"
  port: 5432
  name: "myapp"
  user: "admin"
  password: "secret"
  pool:
    min_size: 5
    max_size: 20
    idle_timeout_ms: 60000

# config/features.yml
features:
  caching: true
  rate_limiting: true
  analytics: false

redis:
  default:
    host: "localhost"
    port: 6379
  cache:
    host: "localhost"
    port: 6380
    db: 1