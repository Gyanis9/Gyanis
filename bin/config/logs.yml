logs:
  - name: root
    level: info
    appenders:
      - type: FileLogAppender
        file: logs/root.txt
      - type: StdoutLogAppender
        color: true
  - name: system
    level: info
    appenders:
      - type: FileLogAppender
        file: logs/system.txt
      - type: StdoutLogAppender
        color: true